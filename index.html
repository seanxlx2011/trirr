<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trirr.io</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background-color: black;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }

    /* 启动界面样式 */
    #startScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    #startScreen h1 {
      font-size: 72px;
      font-weight: bold;
      margin: 0 0 60px 0;
      color: #000000;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                   0 0 40px rgba(255, 255, 255, 0.6),
                   0 0 60px rgba(255, 255, 255, 0.4),
                   0 0 80px rgba(255, 255, 255, 0.2);
      letter-spacing: 8px;
      animation: glow 2s ease-in-out infinite alternate;
      transition: margin 0.2s ease-out, opacity 0.5s ease-in-out;
    }

    #startScreen h1.centered {
      margin: 0;
      opacity: 1;
    }

    #startScreen h1.fade-out {
      opacity: 0;
    }

    @keyframes glow {
      from {
        text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                     0 0 40px rgba(255, 255, 255, 0.6),
                     0 0 60px rgba(255, 255, 255, 0.4),
                     0 0 80px rgba(255, 255, 255, 0.2);
      }
      to {
        text-shadow: 0 0 30px rgba(255, 255, 255, 1),
                     0 0 50px rgba(255, 255, 255, 0.8),
                     0 0 70px rgba(255, 255, 255, 0.6),
                     0 0 90px rgba(255, 255, 255, 0.4);
      }
    }

    #startButton {
      padding: 10px 40px; /* 减小50%：20px→10px, 80px→40px */
      font-size: 12px; /* 减小50%：24px→12px */
      font-weight: bold;
      color: #000000; /* 黑色文字 */
      background: #FFFFFF; /* 白色背景 */
      border: none;
      border-radius: 25px; /* 圆角也减半：50px→25px */
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5); /* 白色发光阴影 */
      letter-spacing: 4px;
      opacity: 0;
      pointer-events: none;
    }

    #startButton.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #startButton:hover {
      background: #F0F0F0; /* 悬停时稍微变暗 */
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8), /* 更强的发光 */
                  0 4px 15px rgba(255, 255, 255, 0.3);
    }

    #startButton:active {
      transform: translateY(0);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    #gameCanvas {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 10;
      contain: strict; /* Isolate canvas from rest of page */
      background-color: black; /* Ensure background is black */
      /* GPU加速优化 */
      transform: translateZ(0);
      will-change: transform;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
    }

    #gameCanvas.active {
      display: block !important; /* Force display */
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      z-index: 9999 !important; /* 超高层级确保显示 */
    }

    /* 3D隧道Canvas */
    #tunnelCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* 启动界面内容 */
    #startScreenContent {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      pointer-events: none; /* 让点击穿透到Canvas */
    }

    #startScreenContent > * {
      pointer-events: auto; /* 恢复按钮的点击能力 */
    }

    /* 按钮容器 */
    #buttonContainer {
      display: flex;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }

    /* 房间按钮 */
    #roomButton {
      padding: 10px 40px;
      font-size: 12px;
      font-weight: bold;
      color: #000000;
      background: #FFFFFF;
      border: none;
      border-radius: 25px;
      cursor: pointer;
      transition: all 0.3s ease;
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.5);
      letter-spacing: 4px;
      opacity: 0;
      pointer-events: none;
    }

    #roomButton.visible {
      opacity: 1;
      pointer-events: auto;
    }

    #roomButton:hover {
      background: #F0F0F0;
      transform: translateY(-2px);
      box-shadow: 0 0 25px rgba(255, 255, 255, 0.8),
                  0 4px 15px rgba(255, 255, 255, 0.3);
    }

    #roomButton:active {
      transform: translateY(0);
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.4);
    }

    /* 房间按钮上的房间指示 */
    #roomButtonSelected {
      position: absolute;
      top: -8px;
      right: -8px;
      width: 16px;
      height: 16px;
      background: #FF4444;
      border-radius: 50%;
      display: none;
      box-shadow: 0 0 5px rgba(255, 68, 68, 0.8);
    }

    #roomButtonSelected.visible {
      display: block;
    }

    /* 登录中提示 */
    #loginLoading {
      margin-top: 20px;
      padding: 8px 20px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid #FFFFFF;
      border-radius: 5px;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* 预登录信息显示 */
    #preloginInfo {
      margin-top: 20px;
      padding: 8px 20px;
      background: #000000;
      border: 2px solid #FFFFFF;
      border-radius: 5px;
      color: #FFFFFF;
      font-size: 16px;
      font-weight: bold;
      text-align: center;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                  0 0 20px rgba(255, 255, 255, 0.6),
                  0 0 30px rgba(255, 255, 255, 0.4);
      min-width: 200px;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #preloginInfo.visible {
      opacity: 1;
    }

    /* 稀有度颜色 */
    .rarity-0 { color: #999999; }
    .rarity-1 { color: lightgreen; }
    .rarity-2 { color: gold; }
    .rarity-3 { color: yellow; }
    .rarity-4 { color: orange; }
    .rarity-5 { color: cyan; }
    .rarity-6 { color: brown; }
    .rarity-7 { color: gold; }
    .rarity-8 { color: #ddffdd; }
    .rarity-9 { color: yellow; }
    .rarity-10 { color: white; }
    .rarity-11 { color: #dddddd; }

    /* 房间选择界面 */
    #roomSelection {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      z-index: 10000;
      justify-content: center;
      align-items: center;
    }

    #roomSelection.visible {
      display: flex;
    }

    #roomPanel {
      background: rgba(0, 0, 0, 0.9);
      border: 3px solid rgba(255, 255, 255, 0.8);
      border-radius: 25px;
      padding: 40px;
      max-width: 700px;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 0 40px rgba(255, 255, 255, 0.5);
      position: relative;
      backdrop-filter: blur(10px);
    }

    /* 关闭按钮 */
    #closeRoomPanel {
      position: absolute;
      top: 15px;
      right: 15px;
      width: 40px;
      height: 40px;
      background: rgba(255, 255, 255, 0.1);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 50%;
      color: #FFFFFF;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
    }

    #closeRoomPanel:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.8);
      transform: rotate(90deg);
    }

    #roomPanel h2 {
      color: #000000;
      text-align: center;
      margin: 0 0 30px 0;
      font-size: 32px;
      font-weight: bold;
      text-shadow: 0 0 20px rgba(255, 255, 255, 0.8),
                   0 0 40px rgba(255, 255, 255, 0.6),
                   0 0 60px rgba(255, 255, 255, 0.4);
      letter-spacing: 4px;
    }

    #roomList {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }

    .room-item {
      background: rgba(0, 0, 0, 0.6);
      border: 3px solid rgba(255, 255, 255, 0.4);
      border-radius: 15px;
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.3s ease;
      cursor: pointer;
      position: relative;
    }

    .room-item:hover {
      background: rgba(0, 0, 0, 0.8);
      border-color: rgba(255, 255, 255, 0.8);
      transform: translateY(-3px);
      box-shadow: 0 5px 20px rgba(255, 255, 255, 0.3);
    }

    .room-item.selected {
      border-color: #FFFFFF;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.6);
    }

    .room-item.selected::before {
      content: '✓';
      position: absolute;
      top: 10px;
      right: 10px;
      color: #FFFFFF;
      font-size: 24px;
      font-weight: bold;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.8);
    }

    .room-item.full {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .room-item.full:hover {
      transform: none;
      box-shadow: none;
    }

    .room-info {
      flex: 1;
    }

    .room-name {
      color: #FFFFFF;
      font-size: 24px;
      font-weight: bold;
      margin-bottom: 8px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
    }

    .room-details {
      color: rgba(255, 255, 255, 0.7);
      font-size: 16px;
    }

    .room-admin {
      color: rgba(255, 255, 255, 0.6);
      font-size: 14px;
      margin-top: 5px;
      font-style: italic;
    }

    #createRoomButton {
      width: 100%;
      background: rgba(255, 255, 255, 0.1);
      color: #FFFFFF;
      border: 3px solid rgba(255, 255, 255, 0.5);
      padding: 18px;
      border-radius: 15px;
      font-size: 20px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 20px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
      letter-spacing: 2px;
    }

    #createRoomButton:hover {
      background: rgba(255, 255, 255, 0.2);
      border-color: rgba(255, 255, 255, 0.8);
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(255, 255, 255, 0.4);
    }

    /* 当前选择显示 */
    #currentRoomDisplay {
      margin-top: 15px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.7);
      border: 2px solid rgba(255, 255, 255, 0.5);
      border-radius: 8px;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      text-align: center;
      min-height: 20px;
      opacity: 0;
      transition: opacity 0.3s ease;
      pointer-events: none;
    }

    #currentRoomDisplay.visible {
      opacity: 1;
    }

  </style>
  <script type="module" crossorigin src="/assets/index-C5aMOBz8.js"></script>
</head>
<body>
  <!-- 启动界面 -->
  <div id="startScreen">
    <!-- 3D隧道Canvas -->
    <canvas id="tunnelCanvas"></canvas>

    <!-- 启动界面内容 -->
    <div id="startScreenContent">
      <h1>Trirr.io</h1>
      <div id="loginLoading">登录中...</div>
      <div id="buttonContainer">
        <button id="startButton">启动</button>
        <button id="roomButton">
          房间
          <span id="roomButtonSelected"></span>
        </button>
      </div>
      <div id="currentRoomDisplay"></div>
      <div id="preloginInfo"></div>
    </div>
  </div>

  <!-- 房间选择界面 -->
  <div id="roomSelection">
    <div id="roomPanel">
      <button id="closeRoomPanel">✕</button>
      <h2>选择房间</h2>
      <div id="roomList"></div>
      <button id="createRoomButton">创建房间</button>
    </div>
  </div>

  <!-- 游戏画布 -->
  <canvas id="gameCanvas"></canvas>
</body>
</html>
